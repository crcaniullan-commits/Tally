services:
  postgres:
    image: postgres:16-alpine
    container_name: TallyDb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    container_name: Tally-tests
    restart: "no"
    # Corre en paralelo con postgres y app: no bloquea el arranque.
    # Hoy los tests son unitarios con mocks, así que no necesita DB.
    # Cuando agregues tests de integración (storage.go), agrega aquí:
    #   depends_on:
    #     postgres:
    #       condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: TalleyRedis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["cmd", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: Tally-api
    restart: unless-stopped
    environment:
      ADDR: ":${BACKEND_PORT:-8080}"
      DB_ADDR: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      DB_MAX_OPEN_CONNS: "30"
      DB_MAX_IDLE_CONNS: "30"
      DB_MAX_IDLE_TIME: "15m"
      EXTERNAL_URL: "localhost:${BACKEND_PORT:-8080}"
      GMAIL_SMTP_USERNAME: "{GMAIL_SMTP_USERNAME}"
      GMAIL_SMTP_PASSWORD: "{GMAIL_SMTP_PASSWORD}"
      GMAIL_SMTP_FROM: "{GMAIL_SMTP_FROM}"
      STORAGE_DRIVER: "{STORAGE_DRIVER}"
      S3_ENDPOINT: "{S3_ENDPOINT}"
      S3_REGION: "{S3_REGION}"
      S3_BUCKET: "{S3_BUCKET}"
      S3_ACCESS_KEY: "{S3_ACCESS_KEY}"
      S3_SECRET_KEY: "{S3_SECRET_KEY}"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - files_data:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  files_data: