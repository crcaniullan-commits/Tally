basePath: /v1
definitions:
  auth.PayloadCrearMunicipal:
    properties:
      email:
        maxLength: 100
        type: string
      nombre:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      rut:
        maxLength: 12
        minLength: 9
        type: string
    required:
    - email
    - nombre
    - password
    - rut
    type: object
  auth.PayloadCrearUsuario:
    properties:
      code:
        type: string
      email:
        maxLength: 100
        type: string
      nombre:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      rut:
        maxLength: 10
        type: string
    required:
    - code
    - email
    - nombre
    - password
    - rut
    type: object
  auth.PayloadInicioSesion:
    properties:
      email:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  categories.PayloadCategoria:
    properties:
      nombre:
        maxLength: 30
        type: string
    required:
    - nombre
    type: object
  clavesacceso.PayloadCorreo:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  debtors.PayloadActualizacionDeudor:
    properties:
      fecha_limite:
        type: string
      monto:
        type: integer
      nombre:
        maxLength: 30
        type: string
    required:
    - fecha_limite
    - monto
    - nombre
    type: object
  debtors.PayloadDeudor:
    properties:
      descripcion:
        maxLength: 100
        type: string
      fecha_limite:
        type: string
      monto:
        type: integer
      nombre:
        maxLength: 30
        type: string
    required:
    - descripcion
    - fecha_limite
    - monto
    - nombre
    type: object
  empresas.PayloadEmpresa:
    properties:
      nombre_empresa:
        maxLength: 30
        type: string
    required:
    - nombre_empresa
    type: object
  expenses.PayloadGasto:
    properties:
      category_id:
        type: string
      descripcion:
        maxLength: 100
        type: string
      monto:
        type: integer
    required:
    - category_id
    - monto
    type: object
  goals.EstadoMeta:
    properties:
      monto_actual:
        type: integer
      monto_pendiente:
        type: integer
      porcentaje_actual:
        type: number
      porcentaje_faltante:
        type: number
    type: object
  goals.PayloadCrearMeta:
    properties:
      monto_meta:
        type: integer
      nombre:
        maxLength: 30
        type: string
      periodo:
        allOf:
        - $ref: '#/definitions/utilidades.PeriodoMeta'
        enum:
        - dia
        - semana
        - mes
    required:
    - monto_meta
    - nombre
    - periodo
    type: object
  incomes.PayloadIngreso:
    properties:
      category_id:
        type: string
      descripcion:
        maxLength: 100
        type: string
      monto:
        type: integer
      payment_method:
        allOf:
        - $ref: '#/definitions/model.PaymentMethod'
        enum:
        - debito
        - credito
        - transferencia
        - efectivo
    required:
    - monto
    - payment_method
    type: object
  model.AccessKey:
    properties:
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      expires_at:
        type: string
      id:
        type: string
      redeemed_at:
        type: string
      redeemed_by:
        type: string
      revoked_at:
        type: string
      revoked_by:
        type: string
    type: object
  model.Categorie:
    properties:
      empresa_id:
        type: string
      id:
        type: string
      nombre:
        type: string
    type: object
  model.Debtor:
    properties:
      created_at:
        type: string
      descripcion:
        type: string
      empresa_id:
        type: string
      fecha_limite:
        type: string
      id:
        type: string
      monto:
        type: integer
      nombre:
        type: string
      pagado:
        type: boolean
    type: object
  model.Empresa:
    properties:
      id:
        type: string
      nombre_empresa:
        type: string
      user_id:
        type: string
    type: object
  model.Expense:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      descripcion:
        type: string
      empresa_id:
        type: string
      fecha:
        type: string
      id:
        type: string
      monto:
        type: integer
    type: object
  model.Goal:
    properties:
      created_at:
        type: string
      empresa_id:
        type: string
      id:
        type: string
      monto_meta:
        type: integer
      nombre:
        type: string
      periodo:
        $ref: '#/definitions/model.GoalPeriod'
    type: object
  model.GoalPeriod:
    enum:
    - dia
    - semana
    - mes
    type: string
    x-enum-varnames:
    - GoalPeriodDia
    - GoalPeriodSemana
    - GoalPeriodMes
  model.Income:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      descripcion:
        type: string
      empresa_id:
        type: string
      fecha:
        type: string
      id:
        type: string
      monto:
        type: integer
      payment_method:
        $ref: '#/definitions/model.PaymentMethod'
    type: object
  model.PaymentMethod:
    enum:
    - debito
    - credito
    - transferencia
    - efectivo
    type: string
    x-enum-varnames:
    - PaymentMethodDebito
    - PaymentMethodCredito
    - PaymentMethodTransferencia
    - PaymentMethodEfectivo
  model.RUT:
    properties:
      cuerpo:
        description: 'Ej: 19234567'
        type: integer
      dv:
        description: 'Ej: "K" o "4"'
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      nombre:
        type: string
      plan_expires_at:
        type: string
      role:
        $ref: '#/definitions/model.UserRole'
      rut:
        $ref: '#/definitions/model.RUT'
      updated_at:
        type: string
    type: object
  model.UserRole:
    enum:
    - usuario
    - municipal
    type: string
    x-enum-varnames:
    - UserRoleUsuario
    - UserRoleMunicipal
  users.PayloadActualizarUsuario:
    properties:
      nombre:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    type: object
  utilidades.PeriodoMeta:
    enum:
    - dia
    - semana
    - mes
    type: string
    x-enum-varnames:
    - GoalPeriodDia
    - GoalPeriodSemana
    - GoalPeriodMes
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API para Tally, app financiera para emprendedores
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Tally
paths:
  /aplicacion/claves:
    post:
      consumes:
      - application/json
      description: 'Genera un código de acceso, lo guarda asociado al municipal autenticado
        (created_by) con un año de vencimiento y lo envía por correo al destinatario
        del payload. La respuesta viene envuelta en {"datos": ...} con la llave creada;
        el código también viaja en el correo. Emitir es independiente de canjear:
        el emprendedor lo canjea después en POST /aplicacion/autenticacion.'
      parameters:
      - description: correo del destinatario
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/clavesacceso.PayloadCorreo'
      produces:
      - application/json
      responses:
        "201":
          description: código creado
          schema:
            $ref: '#/definitions/model.AccessKey'
        "400":
          description: payload inválido o email mal formado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Emitir un código de acceso
      tags:
      - ClavesAcceso
  /aplicacion/claves/IDAcceso/{claveID}:
    post:
      consumes:
      - application/json
      description: 'Vuelve a mandar por correo el código de una llave existente, sin
        crear una llave nueva ni mover su vencimiento: si el correo se perdió, el
        código sigue siendo el mismo. La respuesta viene envuelta en {"datos": ...}
        con el mensaje de confirmación. Un claveID que no sea un UUID responde 400
        y una llave inexistente, 404.'
      parameters:
      - description: ID de la llave de acceso
        in: path
        name: claveID
        required: true
        type: string
      - description: correo del destinatario
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/clavesacceso.PayloadCorreo'
      produces:
      - application/json
      responses:
        "200":
          description: correo reenviado
          schema:
            type: string
        "400":
          description: claveID inválido o payload inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: llave de acceso inexistente
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Reenviar el código de acceso
      tags:
      - ClavesAcceso
  /aplicacion/claves/revocar/{codigo}:
    post:
      description: 'Revoca una llave por su código, dejando registro de quién la revocó
        (revoked_by) y cuándo (revoked_at). Revocar es ortogonal a canjear y a vencer:
        deja la llave inútil aunque siga vigente. La respuesta viene envuelta en {"datos":
        ...} con el mensaje de confirmación. Un código que no existe responde 404.'
      parameters:
      - description: código de acceso a revocar
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: código revocado
          schema:
            type: string
        "400":
          description: código vacío
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: código inexistente
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Revocar un código de acceso
      tags:
      - ClavesAcceso
  /aplicacion/empresas:
    get:
      description: 'Devuelve todas las empresas asociadas al usuario autenticado.
        La respuesta viene envuelta en {"datos": ...}.'
      produces:
      - application/json
      responses:
        "200":
          description: lista de empresas
          schema:
            items:
              $ref: '#/definitions/model.Empresa'
            type: array
        "404":
          description: empresas no encontradas
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Listar empresas
      tags:
      - Empresas
    post:
      consumes:
      - application/json
      description: 'Crea una nueva empresa asociada al usuario autenticado. La respuesta
        viene envuelta en {"datos": ...} con la empresa creada.'
      parameters:
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/empresas.PayloadEmpresa'
      produces:
      - application/json
      responses:
        "201":
          description: empresa creada
          schema:
            $ref: '#/definitions/model.Empresa'
        "400":
          description: payload de la empresa erroneo
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Crear empresa
      tags:
      - Empresas
  /aplicacion/empresas/{empresaID}:
    delete:
      description: 'Elimina una empresa, siempre que pertenezca al usuario autenticado.
        La respuesta viene envuelta en {"datos": ...} con el mensaje de confirmación.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: empresa borrada
          schema:
            type: string
        "404":
          description: empresa no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Eliminar empresa
      tags:
      - Empresas
  /aplicacion/empresas/{empresaID}/{nombre}:
    patch:
      description: 'Cambia el nombre de una empresa, siempre que pertenezca al usuario
        autenticado. La respuesta viene envuelta en {"datos": ...} con el mensaje
        de confirmación.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      - description: Nuevo nombre de la empresa
        in: path
        name: nombre
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: nombre actualizado
          schema:
            type: string
        "400":
          description: ruta debe incluir el nombre de la empresa
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: empresa no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Cambiar nombre de empresa
      tags:
      - Empresas
  /aplicacion/empresas/{empresaID}/categorias:
    get:
      description: 'Devuelve las categorías de la empresa autenticada y las globales.
        Las globales se distinguen porque "empresa_id" viene null. La respuesta viene
        envuelta en {"datos": [...]} con las categorías propias primero, ordenadas
        por nombre.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: categorías de la empresa y globales
          schema:
            items:
              $ref: '#/definitions/model.Categorie'
            type: array
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Listar categorías
      tags:
      - Categorias
    post:
      consumes:
      - application/json
      description: 'Crea una nueva categoría asociada a la empresa autenticada. La
        respuesta viene envuelta en {"datos": ...} con la categoría creada.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/categories.PayloadCategoria'
      produces:
      - application/json
      responses:
        "201":
          description: categoría creada
          schema:
            $ref: '#/definitions/model.Categorie'
        "400":
          description: payload de la categoría erróneo o la categoría ya existe
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Crear categoría
      tags:
      - Categorias
  /aplicacion/empresas/{empresaID}/categorias/{categoria}:
    delete:
      description: 'Elimina una categoría, siempre que pertenezca a la empresa autenticada.
        La respuesta viene envuelta en {"datos": ...} con el mensaje de confirmación.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      - description: ID de la categoría
        in: path
        name: categoria
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: categoría eliminada
          schema:
            type: string
        "400":
          description: categoria invalido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: categoría no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Eliminar categoría
      tags:
      - Categorias
  /aplicacion/empresas/{empresaID}/categorias/{categoriaID}:
    patch:
      description: 'Cambia el nombre de una categoría, siempre que pertenezca a la
        empresa autenticada. La respuesta viene envuelta en {"datos": ...} con el
        mensaje de confirmación.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      - description: ID de la categoría
        in: path
        name: categoriaID
        required: true
        type: string
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/categories.PayloadCategoria'
      produces:
      - application/json
      responses:
        "200":
          description: nombre cambiado
          schema:
            type: string
        "400":
          description: categoriaID inválido o payload erróneo
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: categoría no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Cambiar nombre de categoría
      tags:
      - Categorias
  /aplicacion/empresas/{empresaID}/deudas:
    get:
      description: 'Devuelve todas las deudas de la empresa autenticada, ordenadas
        de la más nueva a la más antigua. La respuesta viene envuelta en {"datos":
        [...]}. Si no hay deudas devuelve una lista vacía.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: deudas de la empresa
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/model.Debtor'
              type: array
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Listar deudas
      tags:
      - Deudas
    post:
      consumes:
      - application/json
      description: 'Crea una deuda asociada a la empresa autenticada. "monto" es un
        entero en pesos chilenos (CLP, sin decimales) y debe ser mayor que cero. "fecha_limite"
        se envía como fecha-hora RFC3339. La respuesta viene envuelta en {"datos":
        ...} con la deuda creada.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/debtors.PayloadDeudor'
      produces:
      - application/json
      responses:
        "201":
          description: deuda creada
          schema:
            $ref: '#/definitions/model.Debtor'
        "400":
          description: payload inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Crear deuda
      tags:
      - Deudas
  /aplicacion/empresas/{empresaID}/deudas/{deudorID}:
    patch:
      consumes:
      - application/json
      description: 'Actualiza "nombre", "monto" y "fecha_limite" de una deuda de la
        empresa autenticada. La descripción no se modifica. "monto" es un entero en
        pesos chilenos (CLP, sin decimales) y debe ser mayor que cero. La respuesta
        viene envuelta en {"datos": ...}.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      - description: ID de la deuda
        in: path
        name: deudorID
        required: true
        type: string
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/debtors.PayloadActualizacionDeudor'
      produces:
      - application/json
      responses:
        "200":
          description: deuda actualizada
          schema:
            type: string
        "400":
          description: deudorID o payload inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: deuda no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Actualizar deuda
      tags:
      - Deudas
  /aplicacion/empresas/{empresaID}/deudas/{deudorID}/pagada:
    patch:
      description: 'Marca como pagada una deuda de la empresa autenticada. La operación
        es idempotente. La respuesta viene envuelta en {"datos": ...} con el mensaje
        de confirmación.'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      - description: ID de la deuda
        in: path
        name: deudorID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: deuda pagada
          schema:
            type: string
        "400":
          description: deudorID invalido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: deuda no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Marcar deuda como pagada
      tags:
      - Deudas
  /aplicacion/empresas/{empresaID}/gastos:
    get:
      description: 'Devuelve una página de los gastos de la empresa autenticada, ordenados
        del más reciente al más antiguo. La respuesta viene envuelta en {"datos":
        [...]}. Paginá con limite (entre 1 y 30, por defecto 30) y desplazamiento;
        el rango se acota con desde y hasta en formato AAAA-MM-DD, y por categoría
        con categoria_id (el UUID de la categoría, no su nombre). Un parámetro mal
        formado responde 400. Los montos son enteros en pesos chilenos (CLP, sin decimales).'
      parameters:
      - description: ID de la empresa
        in: path
        name: empresaID
        required: true
        type: string
      - description: cantidad maxima de gastos a devolver (1-30, default 30)
        in: query
        name: limite
        type: integer
      - description: gastos a saltar, para pedir la pagina siguiente
        in: query
        name: desplazamiento
        type: integer
      - description: fecha minima del rango (AAAA-MM-DD)
        in: query
        name: desde
        type: string
      - description: fecha maxima del rango (AAAA-MM-DD)
        in: query
        name: hasta
        type: string
      - description: UUID de la categoria por la que filtrar
        in: query
