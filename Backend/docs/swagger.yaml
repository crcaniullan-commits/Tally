basePath: /v1
definitions:
  auth.CreateUserPayload:
    properties:
      email:
        maxLength: 100
        type: string
      nombre:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      rut:
        maxLength: 10
        type: string
    required:
    - email
    - nombre
    - password
    - rut
    type: object
  auth.LoginUserPayload:
    properties:
      email:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  incomes.IncomePayload:
    properties:
      descripcion:
        maxLength: 100
        type: string
      monto:
        type: integer
      payment_method:
        allOf:
        - $ref: '#/definitions/util.PaymentMethod'
        enum:
        - debito
        - credito
        - transferencia
        - efectivo
    required:
    - monto
    - payment_method
    type: object
  incomes.IncomeStorage:
    properties:
      created_at:
        type: string
      descripcion:
        type: string
      fecha:
        type: string
      id:
        type: string
      monto:
        type: integer
      payment_method:
        $ref: '#/definitions/util.PaymentMethod'
      userID:
        type: string
    type: object
  users.UpdateUserPayload:
    properties:
      nombre:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - nombre
    - password
    type: object
  users.Users:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      nombre:
        type: string
      role:
        $ref: '#/definitions/util.UserRole'
      rut:
        $ref: '#/definitions/util.RUT'
      updated_at:
        type: string
    type: object
  util.PaymentMethod:
    enum:
    - debito
    - credito
    - transferencia
    - efectivo
    type: string
    x-enum-varnames:
    - PaymentMethodDebito
    - PaymentMethodCredito
    - PaymentMethodTransferencia
    - PaymentMethodEfectivo
  util.RUT:
    properties:
      cuerpo:
        description: 'Ej: 19234567'
        type: integer
      dv:
        description: 'Ej: "K" o "4"'
        type: string
    type: object
  util.UserRole:
    enum:
    - usuario
    - municipal
    type: string
    x-enum-varnames:
    - UserRoleUsuario
    - UserRoleMunicipal
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API para Tally, app financiera para emprendedores
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Tally
paths:
  /app/incomes:
    get:
      description: 'Devuelve todos los ingresos del usuario autenticado. La respuesta
        viene envuelta en {"data": [...]}. Si el usuario no tiene ingresos, "data"
        es una lista vacia. Los montos son enteros en pesos chilenos (CLP, sin decimales).'
      produces:
      - application/json
      responses:
        "200":
          description: lista de ingresos
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/incomes.IncomeStorage'
              type: array
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Listar ingresos del usuario
      tags:
      - Incomes
    post:
      consumes:
      - application/json
      description: 'Registra un nuevo ingreso asociado al usuario autenticado. La
        respuesta viene envuelta en {"data": ...} con el ingreso creado, incluyendo
        el id y las fechas que asigna la base. "monto" es un entero en pesos chilenos
        (CLP, sin decimales).'
      parameters:
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/incomes.IncomePayload'
      produces:
      - application/json
      responses:
        "201":
          description: ingreso creado
          schema:
            $ref: '#/definitions/incomes.IncomeStorage'
        "400":
          description: payload del ingreso erroneo
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Registrar ingreso
      tags:
      - Incomes
  /app/incomes/{incomeID}:
    delete:
      description: 'Elimina un ingreso por su ID, siempre que pertenezca al usuario
        autenticado. La respuesta viene envuelta en {"data": ...} con el mensaje de
        confirmación.'
      parameters:
      - description: ID del ingreso
        in: path
        name: incomeID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ingreso eliminado
          schema:
            type: string
        "400":
          description: incomeID invalido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: ingreso no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Eliminar ingreso
      tags:
      - Incomes
  /app/users/{userID}:
    delete:
      description: Elimina un usuario de la base de datos
      parameters:
      - description: ID del usuario
        in: path
        name: userID
        required: true
        type: string
      responses:
        "200":
          description: usuario eliminado
          schema:
            type: string
        "400":
          description: userID invalido
          schema: {}
        "404":
          description: usuario no encontrado
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Eliminar usuario
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Actualiza un usuario en la base de datos
      parameters:
      - description: ID del usuario
        in: path
        name: userID
        required: true
        type: string
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/users.UpdateUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: usuario actualizado
          schema:
            type: string
        "400":
          description: payload del usuario erroneo
          schema: {}
        "404":
          description: usuario no encontrado
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Actualizar usuario
      tags:
      - Users
  /app/users/municipal/{rut}:
    get:
      description: Busca un usuario por su rut
      parameters:
      - description: rut del usuario
        in: path
        name: rut
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: usuario
          schema:
            $ref: '#/definitions/users.Users'
        "400":
          description: rut invalido
          schema: {}
        "404":
          description: usuario no encontrado
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Buscar usuario por rut
      tags:
      - Users
  /auth:
    post:
      consumes:
      - application/json
      description: Registra un nuevo usuario y devuelve un token de autenticación
      parameters:
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.CreateUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: token de autenticacion
          schema:
            type: string
        "400":
          description: payload erroneo o datos duplicados
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      summary: Registrar usuario
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Inicia sesión con email y contraseña y devuelve un token de autenticación
      parameters:
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.LoginUserPayload'
      produces:
      - application/json
      responses:
        "202":
          description: token de autenticacion
          schema:
            type: string
        "400":
          description: credenciales invalidas
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      summary: Iniciar sesión
      tags:
      - Auth
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Autorization
    type: apiKey
swagger: "2.0"
