basePath: /v1
definitions:
  auth.CreateUserPayload:
    properties:
      email:
        maxLength: 100
        type: string
      nombre:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      rut:
        maxLength: 10
        type: string
    required:
    - email
    - nombre
    - password
    - rut
    type: object
  auth.LoginUserPayload:
    properties:
      email:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  incomes.IncomePayload:
    properties:
      category_id:
        type: string
      descripcion:
        maxLength: 100
        type: string
      monto:
        type: integer
      payment_method:
        allOf:
        - $ref: '#/definitions/model.PaymentMethod'
        enum:
        - debito
        - credito
        - transferencia
        - efectivo
    required:
    - monto
    - payment_method
    type: object
  model.Income:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      descripcion:
        type: string
      fecha:
        type: string
      id:
        type: string
      monto:
        type: integer
      payment_method:
        $ref: '#/definitions/model.PaymentMethod'
      user_id:
        type: string
    type: object
  model.PaymentMethod:
    enum:
    - debito
    - credito
    - transferencia
    - efectivo
    type: string
    x-enum-varnames:
    - PaymentMethodDebito
    - PaymentMethodCredito
    - PaymentMethodTransferencia
    - PaymentMethodEfectivo
  model.RUT:
    properties:
      cuerpo:
        description: 'Ej: 19234567'
        type: integer
      dv:
        description: 'Ej: "K" o "4"'
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      nombre:
        type: string
      plan_expires_at:
        type: string
      role:
        $ref: '#/definitions/model.UserRole'
      rut:
        $ref: '#/definitions/model.RUT'
      updated_at:
        type: string
    type: object
  model.UserRole:
    enum:
    - usuario
    - municipal
    type: string
    x-enum-varnames:
    - UserRoleUsuario
    - UserRoleMunicipal
  users.UpdateUserPayload:
    properties:
      nombre:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API para Tally, app financiera para emprendedores
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Tally
paths:
  /app/incomes:
    get:
      description: 'Devuelve una página de los ingresos del usuario autenticado, ordenados
        del más reciente al más antiguo. La respuesta viene envuelta en {"data": [...]}.
        Paginá con limit (entre 1 y 30, por defecto 30) y offset; el rango se acota
        con since y until en formato AAAA-MM-DD, y por categoría con category_id (el
        UUID de la categoría, no su nombre). Un parámetro mal formado responde 400.
        Los montos son enteros en pesos chilenos (CLP, sin decimales).'
      parameters:
      - description: cantidad maxima de ingresos a devolver (1-30, default 30)
        in: query
        name: limit
        type: integer
      - description: ingresos a saltar, para pedir la pagina siguiente
        in: query
        name: offset
        type: integer
      - description: fecha minima del rango (AAAA-MM-DD)
        in: query
        name: since
        type: string
      - description: fecha maxima del rango (AAAA-MM-DD)
        in: query
        name: until
        type: string
      - description: UUID de la categoria por la que filtrar
        in: query
        name: category_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: pagina de ingresos
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/model.Income'
              type: array
            type: object
        "400":
          description: parametros de paginacion erroneos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Listar ingresos del usuario
      tags:
      - Incomes
    post:
      consumes:
      - application/json
      description: 'Registra un nuevo ingreso asociado al usuario autenticado. La
        respuesta viene envuelta en {"data": ...} con el ingreso creado, incluyendo
        el id y las fechas que asigna la base. "monto" es un entero en pesos chilenos
        (CLP, sin decimales). "category_id" es opcional (la columna es nullable) y
        apunta a la tabla categories.'
      parameters:
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/incomes.IncomePayload'
      produces:
      - application/json
      responses:
        "201":
          description: ingreso creado
          schema:
            $ref: '#/definitions/model.Income'
        "400":
          description: payload del ingreso erroneo
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Registrar ingreso
      tags:
      - Incomes
  /app/incomes/{incomeID}:
    delete:
      description: 'Elimina un ingreso por su ID, siempre que pertenezca al usuario
        autenticado. La respuesta viene envuelta en {"data": ...} con el mensaje de
        confirmación.'
      parameters:
      - description: ID del ingreso
        in: path
        name: incomeID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ingreso eliminado
          schema:
            type: string
        "400":
          description: incomeID invalido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: ingreso no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Eliminar ingreso
      tags:
      - Incomes
  /app/users:
    delete:
      description: Elimina un usuario de la base de datos
      responses:
        "200":
          description: usuario eliminado
          schema:
            type: string
        "400":
          description: userID invalido
          schema: {}
        "404":
          description: usuario no encontrado
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Eliminar usuario
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Actualiza un usuario en la base de datos
      parameters:
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/users.UpdateUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: usuario actualizado
          schema:
            type: string
        "400":
          description: payload del usuario erroneo
          schema: {}
        "404":
          description: usuario no encontrado
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Actualizar usuario
      tags:
      - Users
  /app/users/exchange/{code}:
    post:
      description: Canjea un código de acceso y extiende el plan del usuario autenticado
        hasta el vencimiento de la llave. Un código ya canjeado, vencido o revocado
        se responde 400; uno inexistente, 404.
      parameters:
      - description: codigo de acceso
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: codigo canjeado
          schema:
            type: string
        "400":
          description: codigo invalido, vencido, revocado o ya canjeado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: codigo inexistente
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Canjear un código de acceso
      tags:
      - Users
  /app/users/municipal/{rut}:
    get:
      description: Busca un usuario por su rut
      parameters:
      - description: rut del usuario
        in: path
        name: rut
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: usuario
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: rut invalido
          schema: {}
        "404":
          description: usuario no encontrado
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Buscar usuario por rut
      tags:
      - Users
  /auth:
    post:
      consumes:
      - application/json
      description: Registra un nuevo usuario y devuelve un token de autenticación
      parameters:
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.CreateUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: token de autenticacion
          schema:
            type: string
        "400":
          description: payload erroneo o datos duplicados
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      summary: Registrar usuario
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Inicia sesión con email y contraseña y devuelve un token de autenticación
      parameters:
      - description: payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.LoginUserPayload'
      produces:
      - application/json
      responses:
        "202":
          description: token de autenticacion
          schema:
            type: string
        "400":
          description: credenciales invalidas
          schema: {}
        "500":
          description: error interno del servidor
          schema: {}
      summary: Iniciar sesión
      tags:
      - Auth
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Autorization
    type: apiKey
swagger: "2.0"
